services:
  db:
    image: postgres:17-alpine
    container_name: previewpay-db
    environment:
      POSTGRES_USER: previewpay
      POSTGRES_PASSWORD: previewpay
      POSTGRES_DB: previewpay
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U previewpay"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
